[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend for the Owl of Athens teaching loop."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "openai>=2.29.0",
    "psycopg>=3.3.3",
    "pydantic-settings>=2.13.1",
    "pytest>=9.0.2",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.42.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
